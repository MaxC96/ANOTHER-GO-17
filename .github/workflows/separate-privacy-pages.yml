name: Separate Gotham privacy pages
on:
  push:
    branches: [update/separate-sms-privacy-2026-10-16]
    paths: [.github/workflows/separate-privacy-pages.yml]
permissions:
  contents: write
jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Restore separate SMS policy and direct general-policy footer links
        run: |
          git fetch --depth=1 origin 6029daa06155c72560ec8eb6018e9147fa2299c9
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib, json
          base='6029daa06155c72560ec8eb6018e9147fa2299c9'
          existing_changes=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert all(name.startswith('.github/') for name in existing_changes), existing_changes
          changed=[]
          main_re=re.compile(r'<main\b[^>]*>[\s\S]*?</main>')
          footer_re=re.compile(r'<div\b[^>]*class="footer-legal"[^>]*>[\s\S]*?</div>')
          link_re=re.compile(r'<a\b[^>]*href="/(?:sms-privacy|privacy-policy)"[^>]*>Privacy Policy</a>')
          checked=[]
          for path in sorted(Path('.').glob('*.html')):
              before=path.read_text()
              groups=list(footer_re.finditer(before))
              if not groups: continue
              assert len(groups)==1, path.name
              m=groups[0]
              group=m.group()
              links=link_re.findall(group)
              assert len(links)==1, (path.name,group)
              updated=group.replace(links[0],links[0].replace('href="/sms-privacy"','href="/privacy-policy"'))
              after=before[:m.start()]+updated+before[m.end():]
              assert main_re.findall(before)==main_re.findall(after), path.name
              assert after.replace(updated,group,1)==before, path.name
              assert 'href="/privacy-policy"' in link_re.search(updated).group(), path.name
              checked.append(path.name)
              if before!=after:
                  path.write_text(after)
                  changed.append(path.name)
          assert len(checked)==11,checked
          path=Path('_redirects')
          before=path.read_text()
          assert before.count('/sms-privacy.html /privacy-policy 301!')==1
          assert before.count('/sms-privacy /privacy-policy 301!')==1
          after=before.replace('/sms-privacy.html /privacy-policy 301!','/sms-privacy.html /sms-privacy 301!').replace('/sms-privacy /privacy-policy 301!\n','')
          assert '/privacy-policy.html /privacy-policy 301!' in after
          assert '/sms-terms.html /sms-terms 301!' in after
          assert all(not (line.split() and line.split()[0]=='/sms-privacy') for line in after.splitlines())
          path.write_text(after)
          changed.append(path.name)
          sms=Path('sms-privacy.html').read_text()
          general=Path('privacy-policy.html').read_text()
          assert '<title>SMS Privacy Policy | Gotham Solutions Group</title>' in sms
          assert 'October 13, 2026' in sms and 'GSG Meeting Notifications' in sms
          assert 'href="https://gothamsolutionsgroup.com/sms-privacy"' in sms
          assert 'Oct. 16, 2026' in general and '11. Contact Us' in general
          assert 'href="https://gothamsolutionsgroup.com/privacy-policy"' in general
          for name in ['sms-privacy.html','sms-terms.html','privacy-policy.html']:
              original=subprocess.check_output(['git','show',base+':'+name],text=True)
              assert main_re.findall(original)==main_re.findall(Path(name).read_text()), name
          print(json.dumps({'verified':True,'changed_files':changed,'footers_checked':checked,'sms_policy_main_sha256':hashlib.sha256(main_re.search(sms).group().encode()).hexdigest(),'general_policy_main_sha256':hashlib.sha256(main_re.search(general).group().encode()).hexdigest(),'policies_unchanged':True,'footer_destination':'/privacy-policy','sms_policy_destination':'/sms-privacy'},indent=2))
          workflow='.github/workflows/separate-privacy-pages.yml'
          Path(workflow).unlink()
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','diff','--stat'],check=True)
          subprocess.run(['git','add','--',*changed,workflow],check=True)
          PY
          git -c user.name='Gotham website maintenance' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore separate original SMS privacy policy and point general footer links to privacy-policy'
          git push origin HEAD:update/separate-sms-privacy-2026-10-16
          git rev-parse HEAD
