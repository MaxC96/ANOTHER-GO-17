name: Gotham team directory update
on:
  push:
    branches: [update/remove-faith-2026-10-15]
    paths: [.github/workflows/gotham-team-update.yml]
permissions:
  contents: write
jobs:
  update-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prepare validation tools and reviewed scripts
        run: |
          python -m pip install playwright pyyaml
          python -m playwright install chromium
          npm install --prefix /tmp/gotham-js-tools acorn
          git show fde0d2ec9e556315793f576b6dab8ddc3a66578e:.github/workflows/gotham-team-update.yml > /tmp/original-team-workflow.yml
          python - <<'PY'
          from pathlib import Path
          import yaml
          steps=yaml.safe_load(Path('/tmp/original-team-workflow.yml').read_text())['jobs']['update-and-check']['steps']
          apply=steps[2]['run'].replace('text = original[:m.start()] + original[m.end():]', 'text = original[:m.start()].rstrip(" \\t") + original[m.end():]')
          assert '.rstrip(' in apply
          Path('/tmp/apply-team-update.sh').write_text(apply)
          qa=steps[3]['run']
          qa=qa.replace("scope=page.locator(section)", "scope=page.locator(section)\n            scope.scroll_into_view_if_needed()\n            page.wait_for_timeout(500)\n            scope.screenshot(path='/tmp/gotham-team-qa/after/'+name.replace('.html','')+'-'+str(width)+'.png',animations='disabled')")
          Path('/tmp/check-team-update.sh').write_text(qa)
          Path('/tmp/commit-team-update.sh').write_text(steps[4]['run'])
          PY
      - name: Remove the profiles and rebalance both pages
        run: bash -e /tmp/apply-team-update.sh
      - name: Preserve edited source for review
        run: |
          mkdir -p /tmp/gotham-team-qa/after/source/assets
          cp index.html contact.html /tmp/gotham-team-qa/after/source/
          cp assets/script.js assets/styles.css /tmp/gotham-team-qa/after/source/assets/
      - name: Check desktop, tablet, phone and profile actions
        run: bash -e /tmp/check-team-update.sh
      - name: Commit verified website changes on the review branch
        run: bash -e /tmp/commit-team-update.sh
      - name: Save screenshots and verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gotham-four-person-team-checks
          path: /tmp/gotham-team-qa
          retention-days: 14
